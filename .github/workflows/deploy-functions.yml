name: Deploy calendar feed

# Publishes supabase/functions/calendar (the Outlook hearing calendar feed) to Supabase.
# Needs the repository secrets SUPABASE_ACCESS_TOKEN (a personal access token from
# supabase.com/dashboard/account/tokens) and SUPABASE_PROJECT_REF (the id in the project's
# URL). Without them the run is skipped with a notice.

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice title=Calendar feed not deployed::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets, then run this workflow again."
            exit 0
          fi
          if [ -n "$DASHBOARD_URL" ]; then
            supabase secrets set "DASHBOARD_URL=$DASHBOARD_URL" --project-ref "$PROJECT_REF"
          fi
          supabase functions deploy calendar --no-verify-jwt --project-ref "$PROJECT_REF"
