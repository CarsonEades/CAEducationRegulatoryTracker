name: Check agencies

on:
  schedule:
    # Times are UTC. Every 2 hours from about 6am to 8pm Pacific on weekdays...
    - cron: "7 13-23/2,1,3 * * 1-5"
    # ...and every 6 hours otherwise.
    - cron: "7 */6 * * 0,6"
  workflow_dispatch:
    inputs:
      agency:
        description: "Only this agency id (e.g. sbe). Leave blank for all."
        required: false
      cde_runner:
        description: "Where to check CDE (SBE, ACCS) this run. 'default' follows the CDE_RUNNER variable."
        type: choice
        options: [default, office, cloud]
        default: default

# cde.ca.gov (SBE, ACCS) has challenged requests from GitHub's servers, so those
# agencies can be checked from an office computer running a self-hosted GitHub
# runner: set the repository variable USE_OFFICE_RUNNER to "true" once the
# runner is installed. CDE is read one page per run; see tracker/paced.py for
# the CDE_* pacing variables.
#
# Where CDE is checked: the repository variable CDE_RUNNER ("office", the
# default, or "cloud"), or for a single manual run the cde_runner input. With
# "cloud", the office job doesn't run and GitHub's servers check CDE. Both
# share one pacing queue in the database.
env:
  OFFICE_AGENCIES: ${{ vars.OFFICE_AGENCIES || 'sbe,accs' }}
  CDE_MIN_GAP_MINUTES: ${{ vars.CDE_MIN_GAP_MINUTES }}
  CDE_PAGES_PER_RUN: ${{ vars.CDE_PAGES_PER_RUN }}
  CDE_PAGE_GAP_SECONDS: ${{ vars.CDE_PAGE_GAP_SECONDS }}

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Separate queues per job, so an office computer that's switched off
    # never holds up the cloud checks.
    concurrency:
      group: scrape-cloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Scrape and alert
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT }}
          AGENCY: ${{ inputs.agency }}
          TRACKER_ORIGIN: github
          # Leave CDE to the office job unless CDE is set to run here.
          EXCLUDE: ${{ vars.USE_OFFICE_RUNNER == 'true' && !(inputs.cde_runner == 'cloud' || (inputs.cde_runner != 'office' && vars.CDE_RUNNER == 'cloud')) && env.OFFICE_AGENCIES || '' }}
        run: python -m tracker run ${AGENCY:+--agency "$AGENCY"} --exclude "$EXCLUDE"

  office:
    if: vars.USE_OFFICE_RUNNER == 'true' && !(inputs.cde_runner == 'cloud' || (inputs.cde_runner != 'office' && vars.CDE_RUNNER == 'cloud'))
    runs-on: self-hosted
    timeout-minutes: 60
    concurrency:
      group: scrape-office
      cancel-in-progress: false
    # Uses the Python installed on the office computer (3.12 or newer, installed
    # for all users and added to PATH). actions/setup-python is unreliable on
    # self-hosted Windows runners.
    steps:
      - uses: actions/checkout@v4
      - name: Create Python environment
        run: ${{ runner.os == 'Windows' && 'py -3' || 'python3' }} -m venv .venv
      - name: Install
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m pip install --quiet --disable-pip-version-check .
      - name: Scrape and alert (agencies that block cloud servers)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT }}
          PYTHONIOENCODING: utf-8
          TRACKER_ORIGIN: office
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m tracker run --agencies "${{ env.OFFICE_AGENCIES }}"
